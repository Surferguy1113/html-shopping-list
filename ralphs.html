<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <title>ralphs List</title>
  <link rel="stylesheet" href="style.css">
  <script>
    function toggleStrike(checkbox) {
    const label = checkbox.nextElementSibling;
    label.style.textDecoration = checkbox.checked ? 'line-through' : 'none';
}
  </script>
  <style>
    .container{
      position: relative;
      right:50px;
    }
  </style>
</head>
<body>

    <h1><em><img src="./assets/Images/Shopping Cart.png" height="70"><a href="./index.html" style="text-decoration: none;">SHOPPING LIST</em></h1></a>
  <div class="container">
    <div class="list-1">
      <ol>

          style="text-decoration: none;font-size: large">Ralph's</a></label></button>
          <br>
        <li><strong>DAIRY</strong>
          <ul>
            <li class="priority"><input type="checkbox" id="item-checkbox" checked onclick="toggleStrike(this)"><label for="task1">Just Eggs</li></label>
